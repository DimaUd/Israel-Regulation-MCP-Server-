    <line x1='145' y1='95' x2='145' y2='25' stroke='#ffffff' stroke-width='3'/>
    <rect x='147' y='25' width='55' height='36' fill='#ffffff' stroke='#c2d4ec' stroke-width='1'/>
    <line x1='147' y1='30' x2='202' y2='30' stroke='#0068f5' stroke-width='4'/>
    <line x1='147' y1='55' x2='202' y2='55' stroke='#0068f5' stroke-width='4'/>
    <polygon points='174,38 180,48 168,48' fill='none' stroke='#0068f5' stroke-width='1.5'/>
    <polygon points='174,48 180,38 168,38' fill='none' stroke='#0068f5' stroke-width='1.5'/>

    <g transform='translate(230, -50) rotate(-25)' filter='url(#glow)'>
      <rect x='-8' y='-15' width='16' height='30' rx='4' fill='#ffffff' stroke='#00d2ff' stroke-width='2'/>
      <rect x='-50' y='-10' width='38' height='20' rx='2' fill='#0055ff' stroke='#00f0ff' stroke-width='1.5'/>
      <rect x='12' y='-10' width='38' height='20' rx='2' fill='#0055ff' stroke='#00f0ff' stroke-width='1.5'/>
      <line x1='0' y1='15' x2='-30' y2='60' stroke='#00f0ff' stroke-width='2' stroke-dasharray='4,4'/>
    </g>
  </g>

  <!-- Hebrew Typography -->
  <g transform='translate(560, 230)'>
    <path d='M0 0 L400 0 L420 20 L400 40 L0 40 Z' fill='url(#cyanGlow)' opacity='0.15'/>
    <path d='M10 0 L390 0' stroke='#00f0ff' stroke-width='2'/>
    <text x='380' y='28' fill='#ffffff' font-family='sans-serif' font-weight='bold' font-size='22' text-anchor='end'>
      &gt;&gt; בשיתוף פעולה עם צוות &lt;&lt;
    </text>
  </g>

  <g transform='translate(560, 310)' filter='url(#glow)'>
    <text x='420' y='0' fill='url(#textGrad)' font-family='sans-serif' font-weight='bold' font-size='56' letter-spacing='1' text-anchor='end'>
      דאטה ובינה מלאכותית
    </text>
  </g>
  <g transform='translate(560, 310)'>
    <text x='420' y='0' fill='#ffffff' font-family='sans-serif' font-weight='bold' font-size='56' letter-spacing='1' text-anchor='end' fill-opacity='0.95'>
      דאטה ובינה מלאכותית
    </text>
  </g>

  <!-- Capsule: מערך הדיגיטל הלאומי -->
  <g transform='translate(520, 360)'>
    <rect x='0' y='0' width='440' height='46' rx='23' fill='#082142' stroke='url(#cyanGlow)' stroke-width='2.5'/>
    
    <g transform='translate(35, 23)'>
