    </text>

    <g transform='translate(390, 14)'>
      <rect x='0' y='0' width='4.5' height='4.5' rx='1' fill='#00d2ff'/>
      <rect x='6.5' y='0' width='4.5' height='4.5' rx='1' fill='#00d2ff'/>
      <rect x='13' y='0' width='4.5' height='4.5' rx='1' fill='#00d2ff'/>
      <rect x='0' y='6.5' width='4.5' height='4.5' rx='1' fill='#00d2ff'/>
      <rect x='6.5' y='6.5' width='4.5' height='4.5' rx='1' fill='#00d2ff'/>
      <rect x='13' y='6.5' width='4.5' height='4.5' rx='1' fill='#00d2ff'/>
      <rect x='0' y='13' width='4.5' height='4.5' rx='1' fill='#eab308'/>
      <rect x='6.5' y='13' width='4.5' height='4.5' rx='1' fill='#22c55e'/>
      <rect x='13' y='13' width='4.5' height='4.5' rx='1' fill='#00d2ff'/>
