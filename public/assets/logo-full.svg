    <ellipse cx='0' cy='-6' rx='9' ry='4' fill='none' stroke='#00f0ff' stroke-width='1.5'/>
    <path d='M-9 -6 L-9 4 A9 4 0 0 0 9 4 L9 -6' fill='none' stroke='#00f0ff' stroke-width='1.5'/>
  </g>
  <g transform='translate(490, 65)'>
