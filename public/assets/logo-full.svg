    <rect x='-8' y='22' width='3' height='8' fill='#00f0ff'/>
    <rect x='-2' y='18' width='3' height='12' fill='#00f0ff'/>
    <rect x='4' y='14' width='3' height='16' fill='#00f0ff'/>
  </g>
  <g transform='translate(400, 45)'>
