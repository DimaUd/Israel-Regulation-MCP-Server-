  <g transform='translate(840, 100)'>
    <rect x='160' y='60' width='35' height='150' fill='#092040' stroke='#0068f5' stroke-width='1.2'/>
    <rect x='205' y='30' width='45' height='180' fill='#0b2750' stroke='#0088ff' stroke-width='1.2'/>
    <rect x='260' y='70' width='38' height='140' fill='#071830' stroke='#0055cc' stroke-width='1.2'/>
    
    <rect x='10' y='110' width='160' height='75' fill='#1e3a66' stroke='#fbbf24' stroke-width='2'/>
    <g fill='#fef08a' opacity='0.9'>
