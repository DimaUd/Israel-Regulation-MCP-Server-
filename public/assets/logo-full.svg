    <path d='M-6 3 A4 4 0 0 1 2 -3 A5 5 0 0 1 7 2 A3 3 0 0 1 5 4 L-5 4 A3 3 0 0 1 -6 3' fill='none' stroke='#00f0ff' stroke-width='1.8'/>
  </g>
  <g transform='translate(515, 130)'>
