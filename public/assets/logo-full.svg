<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 480' width='1200' height='480'>
  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#061325'/>
      <stop offset='40%' stop-color='#0a2244'/>
      <stop offset='70%' stop-color='#0d2e5c'/>
      <stop offset='100%' stop-color='#05172e'/>
    </linearGradient>
    <linearGradient id='cyanGlow' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#00f0ff'/>
      <stop offset='50%' stop-color='#00a6ff'/>
      <stop offset='100%' stop-color='#38bdf8'/>
    </linearGradient>
    <linearGradient id='textGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#ffffff'/>
      <stop offset='50%' stop-color='#7dd3fc'/>
      <stop offset='100%' stop-color='#0284c7'/>
    </linearGradient>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='8' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
    <filter id='strongGlow' x='-30%' y='-30%' width='160%' height='160%'>
      <feGaussianBlur stdDeviation='15' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>

  <rect width='1200' height='480' rx='28' fill='url(#bgGrad)'/>
  <rect width='1196' height='476' x='2' y='2' rx='26' fill='none' stroke='url(#cyanGlow)' stroke-width='3' stroke-opacity='0.6'/>

  <!-- Orbital rings & cyber grid -->
  <ellipse cx='260' cy='240' rx='220' ry='180' fill='none' stroke='#0088ff' stroke-width='1.5' stroke-dasharray='6,6' opacity='0.4'/>
  <ellipse cx='260' cy='240' rx='260' ry='120' fill='none' stroke='#00f0ff' stroke-width='2' stroke-opacity='0.5'/>
  <circle cx='260' cy='240' r='160' fill='none' stroke='#0068f5' stroke-width='1.2' opacity='0.3'/>

  <!-- Left: Globe & Cyber Israel Neon Silhouette -->
  <circle cx='220' cy='240' r='140' fill='#071d3a' stroke='#00a6ff' stroke-width='2' opacity='0.9'/>
  <path d='M80 240 Q 220 180 360 240 Q 220 300 80 240' fill='none' stroke='#00d2ff' stroke-width='1.2' opacity='0.4'/>
  <path d='M220 100 Q 180 240 220 380 Q 260 240 220 100' fill='none' stroke='#00d2ff' stroke-width='1.2' opacity='0.4'/>

  <!-- Israel Glowing Neon Silhouette -->
  <g filter='url(#strongGlow)'>
    <path d='M220 120 L235 135 L245 150 L250 175 L235 200 L240 220 L230 250 L220 280 L210 320 L205 350 L200 360 L195 350 L195 315 L190 270 L195 240 L205 210 L215 170 L210 140 Z' 
          fill='#00f0ff' fill-opacity='0.4' stroke='#00f0ff' stroke-width='3.5'/>
  </g>

  <!-- GovAI Robot & Brain -->
  <g transform='translate(380, 110)' filter='url(#glow)'>
    <ellipse cx='60' cy='50' rx='55' ry='42' fill='#0055ff' opacity='0.85'/>
    <ellipse cx='60' cy='50' rx='48' ry='36' fill='#00bfff' opacity='0.9'/>
    <path d='M30 45 Q 45 25 60 45 Q 75 25 90 45' fill='none' stroke='#ffffff' stroke-width='3.5' stroke-linecap='round'/>
    <path d='M35 58 Q 50 72 65 58 Q 80 72 88 58' fill='none' stroke='#ffffff' stroke-width='3.5' stroke-linecap='round'/>
    <circle cx='60' cy='48' r='28' fill='#002266' opacity='0.6'/>
    <rect x='22' y='36' width='76' height='26' rx='13' fill='#0c3058' stroke='#00f0ff' stroke-width='2'/>
    <text x='60' y='54' fill='#ffffff' font-family='Arial, sans-serif' font-weight='bold' font-size='16' text-anchor='middle'>GovAI</text>
  </g>

  <!-- Robot Arm / Hand presenting AI -->
  <g transform='translate(330, 210)'>
    <path d='M20 180 L50 130 L95 90 L115 70' fill='none' stroke='#e2e8f0' stroke-width='14' stroke-linecap='round'/>
    <path d='M20 180 L50 130 L95 90 L115 70' fill='none' stroke='#0068f5' stroke-width='4' stroke-linecap='round'/>
    <circle cx='50' cy='130' r='10' fill='#00d2ff' stroke='#ffffff' stroke-width='2'/>
    <circle cx='95' cy='90' r='8' fill='#00d2ff' stroke='#ffffff' stroke-width='2'/>
    <circle cx='115' cy='70' r='12' fill='#ffffff' stroke='#00a6ff' stroke-width='2'/>
    <path d='M115 65 L125 45 M118 70 L135 55 M115 75 L135 70' stroke='#ffffff' stroke-width='4' stroke-linecap='round'/>
  </g>

