      <rect x='36' y='125' width='6' height='55'/>
      <rect x='50' y='125' width='6' height='55'/>
      <rect x='64' y='125' width='6' height='55'/>
      <rect x='78' y='125' width='6' height='55'/>
      <rect x='92' y='125' width='6' height='55'/>
      <rect x='106' y='125' width='6' height='55'/>
      <rect x='120' y='125' width='6' height='55'/>
      <rect x='134' y='125' width='6' height='55'/>
